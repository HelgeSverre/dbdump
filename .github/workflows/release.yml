name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.1.0)'
        required: true

jobs:
  # Run tests before building release
  test:
    name: Run Tests Before Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      
      - name: Run security tests
        run: |
          go build -o bin/dbdump ./cmd/dbdump
          ./test/verify-security.sh
      
      - name: Run unit tests
        run: go test -v ./...

  # Build release binaries for all platforms
  build:
    name: Build Release Binaries
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Get all tags for version info
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Build binaries for all platforms
        run: |
          mkdir -p bin
          VERSION=${{ steps.get_version.outputs.VERSION }}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          LDFLAGS="-X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}"

          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/dbdump-darwin-amd64 ./cmd/dbdump
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/dbdump-darwin-arm64 ./cmd/dbdump
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/dbdump-linux-amd64 ./cmd/dbdump
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/dbdump-linux-arm64 ./cmd/dbdump
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/dbdump-windows-amd64.exe ./cmd/dbdump
      
      - name: Generate checksums
        run: |
          cd bin
          sha256sum * > checksums.txt
          cat checksums.txt
      
      - name: Create tarball for each platform
        run: |
          cd bin
          
          # macOS AMD64
          tar -czf dbdump-${{ steps.get_version.outputs.VERSION }}-darwin-amd64.tar.gz dbdump-darwin-amd64
          
          # macOS ARM64
          tar -czf dbdump-${{ steps.get_version.outputs.VERSION }}-darwin-arm64.tar.gz dbdump-darwin-arm64
          
          # Linux AMD64
          tar -czf dbdump-${{ steps.get_version.outputs.VERSION }}-linux-amd64.tar.gz dbdump-linux-amd64
          
          # Linux ARM64
          tar -czf dbdump-${{ steps.get_version.outputs.VERSION }}-linux-arm64.tar.gz dbdump-linux-arm64
          
          # Windows AMD64
          zip dbdump-${{ steps.get_version.outputs.VERSION }}-windows-amd64.zip dbdump-windows-amd64.exe
      
      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            bin/dbdump-${{ steps.get_version.outputs.VERSION }}-*.tar.gz
            bin/dbdump-${{ steps.get_version.outputs.VERSION }}-*.zip
            bin/checksums.txt
          retention-days: 90

  # Create GitHub Release
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: ./release-files
      
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          VERSION_NUMBER="${VERSION#v}"
          
          # Extract section from CHANGELOG.md for this version
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[$VERSION_NUMBER\]/,/^## \[/" CHANGELOG.md | sed '$d' > release-notes.md
            
            # If nothing extracted, use a default message
            if [ ! -s release-notes.md ]; then
              echo "Release $VERSION" > release-notes.md
              echo "" >> release-notes.md
              echo "See [CHANGELOG.md](CHANGELOG.md) for full details." >> release-notes.md
            fi
          else
            echo "Release $VERSION" > release-notes.md
          fi
          
          cat release-notes.md
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-files/*.tar.gz
            release-files/*.zip
            release-files/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Verify release artifacts
  verify:
    name: Verify Release
    needs: release
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact: linux-amd64
            ext: ""
          - os: macos-latest
            artifact: darwin-arm64
            ext: ""
          - os: windows-latest
            artifact: windows-amd64
            ext: ".exe"
    
    steps:
      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: ./release-files
      
      - name: Extract and test binary
        shell: bash
        run: |
          cd release-files
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            unzip dbdump-${{ steps.get_version.outputs.VERSION }}-${{ matrix.artifact }}.zip
            chmod +x dbdump-${{ matrix.artifact }}.exe
            ./dbdump-${{ matrix.artifact }}.exe --help
          else
            tar -xzf dbdump-${{ steps.get_version.outputs.VERSION }}-${{ matrix.artifact }}.tar.gz
            chmod +x dbdump-${{ matrix.artifact }}
            ./dbdump-${{ matrix.artifact }} --help
          fi

  # Publish/update the Homebrew formula in helgesverre/homebrew-tap.
  # Requires a HOMEBREW_TAP_TOKEN secret: a PAT (or fine-grained token) with
  # contents:write on helgesverre/homebrew-tap. Skipped automatically if the
  # secret is absent (e.g. on forks).
  homebrew:
    name: Update Homebrew Formula
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check for tap token
        id: gate
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::HOMEBREW_TAP_TOKEN not set; skipping Homebrew formula update."
          fi

      - name: Checkout dbdump (for formula template)
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Get version
        if: steps.gate.outputs.enabled == 'true'
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download release artifacts
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: ./release-files

      - name: Compute checksums
        if: steps.gate.outputs.enabled == 'true'
        id: sha
        run: |
          cd release-files
          V="${{ steps.get_version.outputs.VERSION }}"
          {
            echo "darwin_arm64=$(sha256sum "dbdump-$V-darwin-arm64.tar.gz" | cut -d' ' -f1)"
            echo "darwin_amd64=$(sha256sum "dbdump-$V-darwin-amd64.tar.gz" | cut -d' ' -f1)"
            echo "linux_arm64=$(sha256sum "dbdump-$V-linux-arm64.tar.gz" | cut -d' ' -f1)"
            echo "linux_amd64=$(sha256sum "dbdump-$V-linux-amd64.tar.gz" | cut -d' ' -f1)"
          } >> $GITHUB_OUTPUT

      - name: Checkout tap
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: helgesverre/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula
        if: steps.gate.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          DARWIN_ARM64: ${{ steps.sha.outputs.darwin_arm64 }}
          DARWIN_AMD64: ${{ steps.sha.outputs.darwin_amd64 }}
          LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
          LINUX_AMD64: ${{ steps.sha.outputs.linux_amd64 }}
        run: |
          VERSION_NUMBER="${VERSION#v}"
          sed \
            -e "s|__VERSION_NUMBER__|${VERSION_NUMBER}|g" \
            -e "s|__VERSION__|${VERSION}|g" \
            -e "s|__DARWIN_ARM64__|${DARWIN_ARM64}|g" \
            -e "s|__DARWIN_AMD64__|${DARWIN_AMD64}|g" \
            -e "s|__LINUX_ARM64__|${LINUX_ARM64}|g" \
            -e "s|__LINUX_AMD64__|${LINUX_AMD64}|g" \
            .github/homebrew/dbdump.rb.tmpl > tap/Formula/dbdump.rb
          echo "Rendered formula:"
          cat tap/Formula/dbdump.rb

      - name: Commit and push formula
        if: steps.gate.outputs.enabled == 'true'
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dbdump.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date; nothing to commit."
          else
            git commit -m "dbdump ${{ steps.get_version.outputs.VERSION }}"
            git push
          fi
